layout:
    qmk_keyboard: corne_rotated
    layout_name: LAYOUT_split_3x5_3
parse_config:
    mark_alternate_layer_activators: false
    sticky_label: "sticky"
    toggle_label: "toggle"
layers:
    BASE:
        - [Q, W, E, R, T, Y, U, I, O, P]
        - [
              { h: Gui, t: A },
              { h: Alt, t: S },
              { h: Ctrl, t: D },
              { h: Shift, t: F },
              G,
              H,
              { h: Shift, t: J },
              { h: Ctrl, t: K },
              { h: Alt, t: L },
              { h: Gui, t: ";" },
          ]
        - [Z, X, C, V, B, N, M, ",", ., /]
        - null
        - { h: NAV, t: Esc }
        - { h: MOU, t: Space }
        - { h: SHORTCUT, t: Enter }
        - { h: SYM, t: "Leader" }
        - null
    NAV:
        - [
              "$$tabler:brightness-down$$",
              "$$tabler:brightness-up$$",
              "Screenshot",
              "$$tabler:zoom-out$$",
              "$$tabler:zoom-in$$",
              null,
              null,
              null,
              null,
              "Switch app",
          ]
        - [
              "Gui",
              "Alt",
              "Ctrl",
              "Shift",
              "F12",
              "←",
              "↓",
              "↑",
              "→",
              "Switch app",
          ]
        - [
              "$$tabler:volume-2$$",
              "$$tabler:volume$$",
              "$$tabler:volume-off$$",
              "$$tabler:zoom-reset$$",
              null,
              "Nav left",
              "Move left",
              "Move right",
              "Nav right",
              "Switch window",
          ]
        - null
        - { type: held }
        - null
        - null
        - null
        - null
    MOU:
        - [
              null,
              null,
              "Mouse Min",
              "Mouse Max",
              null,
              null,
              "Click hint",
              "Mouse hint",
              "Screen hint",
              "Switch app",
          ]
        - [
              "Gui",
              "Alt",
              "Ctrl",
              "Shift",
              null,
              "Mouse ←",
              "Mouse ↓",
              "Mouse ↑",
              "Mouse →",
              "Switch app",
