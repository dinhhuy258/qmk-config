        - null
        - { type: held }
        - "Left click"
        - "Right click"
        - null
    SYM:
        - ["&", "7", { t: "8", s: "{" }, { t: "9", s: "}" }, "`", "@", "*", "#", "%", ":"]
        - [{ t: "$", s: "^" }, "4", { t: "5", s: "(" }, { h: "Shift", t: "6", s: ")" }, "~", "!", { h: "Shift", t: "=" }, "-", "\\", ";"]
        - ["0", "1", { t: "2", s: "[" }, { t: "3", s: "]" }, null, "'", '"', ",", ".", "/"]
        - null
        - null
        - null
        - null
        - { type: held }
        - null
